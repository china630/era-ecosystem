plugins {
  id "com.android.application"
  id "org.jetbrains.kotlin.android"
}

android {
  namespace "online.era365.nurse.cover"
  compileSdk 35

  defaultConfig {
    applicationId "online.era365.nurse.cover"
    minSdk 24
    targetSdk 35
    versionCode 1
    versionName "1.0.0"
  }

  signingConfigs {
    debug {
      storeFile file("debug.keystore")
      storePassword "android"
      keyAlias "androiddebugkey"
      keyPassword "android"
    }
  }

  buildTypes {
    release {
      signingConfig signingConfigs.debug
      minifyEnabled false
    }
    debug {
      signingConfig signingConfigs.debug
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.15.0"
}
