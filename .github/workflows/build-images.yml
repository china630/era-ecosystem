name: Build and push images

on:
  push:
    branches: [dev, master]
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated services (empty = all). Example: orchestrator,finance-core,finance-web"
        required: false
        default: ""

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      rebuild_packages: ${{ steps.plan.outputs.rebuild_packages }}
      deploy_scope: ${{ steps.plan.outputs.deploy_scope }}
      deploy_services: ${{ steps.plan.outputs.deploy_services }}
      matrix: ${{ steps.plan.outputs.matrix }}
      package_image_fallback: ${{ steps.plan.outputs.package_image_fallback }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SERVICES: ${{ github.event_name == 'workflow_dispatch' && inputs.services || '' }}
          BEFORE: ${{ github.event.before || '' }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "package_image_fallback=${{ env.REGISTRY }}/${owner}/era-ecosystem/workspace-packages:${REF_NAME}" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            plan=$(node scripts/ci-changed-ghcr-services.mjs --dispatch-services "$DISPATCH_SERVICES")
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            plan=$(node scripts/ci-changed-ghcr-services.mjs --all)
          else
            git diff --name-only "$BEFORE" "$SHA" > /tmp/changed-files.txt
            plan=$(node scripts/ci-changed-ghcr-services.mjs --files-from /tmp/changed-files.txt)
          fi
          echo "$plan"
          skip=$(echo "$plan" | jq -r '.skip')
          rebuild=$(echo "$plan" | jq -r '.rebuildPackages')
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          echo "rebuild_packages=${rebuild}" >> "$GITHUB_OUTPUT"
          echo "deploy_scope=$(echo "$plan" | jq -r '.deployScope')" >> "$GITHUB_OUTPUT"
          echo "deploy_services=$(echo "$plan" | jq -r '.deployServices')" >> "$GITHUB_OUTPUT"
          echo "matrix=$(echo "$plan" | jq -c '.matrix')" >> "$GITHUB_OUTPUT"
          {
            echo "SKIP=${skip}"
            echo "DEPLOY_SCOPE=$(echo "$plan" | jq -r '.deployScope')"
            echo "DEPLOY_SERVICES=$(echo "$plan" | jq -r '.deployServices')"
          } > deploy-scope.env

      - uses: actions/upload-artifact@v4
        with:
          name: deploy-scope
          path: deploy-scope.env
          if-no-files-found: error

  build-packages-base:
    needs: detect
    if: needs.detect.outputs.skip != 'true' && needs.detect.outputs.rebuild_packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      package_image: ${{ steps.out.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: lowercase
        run: echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.owner }}/era-ecosystem/workspace-packages
          tags: |
            type=sha,prefix=${{ github.ref_name }}-,format=short
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_name == 'dev' || github.ref_name == 'master' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.packages
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=workspace-packages
          cache-to: type=gha,mode=max,scope=workspace-packages

      - id: out
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          short=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image=${{ env.REGISTRY }}/${owner}/era-ecosystem/workspace-packages:${{ github.ref_name }}-${short}" >> "$GITHUB_OUTPUT"

  build:
    needs: [detect, build-packages-base]
    if: |
      always() &&
      needs.detect.result == 'success' &&
      needs.detect.outputs.skip != 'true' &&
      (needs.build-packages-base.result == 'success' || needs.build-packages-base.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: lowercase
        run: echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.owner }}/era-ecosystem/${{ matrix.service }}
          tags: |
            type=sha,prefix=${{ github.ref_name }}-,format=short
            type=sha,format=short
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_name == 'dev' || github.ref_name == 'master' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PACKAGE_IMAGE=${{ needs.build-packages-base.outputs.package_image || needs.detect.outputs.package_image_fallback }}
            NEXT_PUBLIC_ORCH_API_URL=https://api.era-365.online
            NEXT_PUBLIC_FINANCE_WEB_URL=https://finance-core.era-365.online
            NEXT_PUBLIC_API_URL=http://finance-core:4100
            NEXT_PUBLIC_CONTROL_PLANE_URL=http://orchestrator:4000
            NEXT_PUBLIC_ORCH_WEB_URL=https://app.era-365.online
            SATELLITE_DIR=${{ matrix.satellite_dir }}
            SATELLITE_PORT=${{ matrix.satellite_port }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
