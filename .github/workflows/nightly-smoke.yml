name: Nightly smoke

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: lowercase
        run: echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare CI env
        run: |
          cp .env.ci.example .env.ci
          owner="${{ steps.lowercase.outputs.owner }}"
          tag="${{ github.ref_name }}"
          if [ "$tag" != "dev" ] && [ "$tag" != "master" ]; then
            tag="dev"
          fi
          {
            echo "GHCR_IMAGE_PREFIX=ghcr.io/${owner}/era-ecosystem"
            echo "IMAGE_TAG=${tag}"
          } >> .env.ci

      - name: Pull images
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.ci pull

      - name: Migrate databases
        run: |
          chmod +x docker/scripts/migrate-all.sh
          COMPOSE_FILE=docker-compose.prod.yml ENV_FILE=.env.ci ./docker/scripts/migrate-all.sh

      - name: Free runner disk
        run: |
          docker container prune -f || true
          docker builder prune -af || true
          df -h /

      - name: Start stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.ci up -d
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.ci up -d --wait --wait-timeout 180 orchestrator

      - name: Ecosystem health smoke
        run: node scripts/ecosystem-smoke-all.mjs

      - name: Script compile checks
        run: |
          node --check scripts/sso-launch-smoke.mjs
          node --check era-hotel-pms/scripts/test-pos-bridge.mjs
          node --check scripts/run-integration-audits.mjs

      - name: Integration audits strict
        run: node scripts/run-integration-audits.mjs --strict

      - name: Upload compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.ci logs > compose-logs.txt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nightly-compose-logs
          path: compose-logs.txt
