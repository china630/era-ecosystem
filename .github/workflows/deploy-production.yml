name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR tag (e.g. prod-abc1234 or latest)
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Write droplet env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          {
            printf '%s\n' "$ENV_FILE" | grep -vE '^(DRONE_SSH_|IMAGE_TAG=|GHCR_IMAGE_PREFIX=|ERA_JWT_JWKS_URL=)' || true
            echo "IMAGE_TAG=${{ inputs.image_tag }}"
            echo "GHCR_IMAGE_PREFIX=ghcr.io/${owner}/era-ecosystem"
            echo "ERA_JWT_JWKS_URL=http://orchestrator:4000/.well-known/jwks.json"
          } > "${GITHUB_WORKSPACE}/era.droplet.env"

      - name: Copy env to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || 22 }}
          source: era.droplet.env
          target: /opt/era-ecosystem
          overwrite: true
          timeout: 60s

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_PULL_TOKEN: ${{ github.token }}
          GIT_SHA: ${{ github.sha }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 30m
          script_stop: false
          envs: GHCR_PULL_TOKEN,GIT_SHA,GH_ACTOR
          script: |
            set -euo pipefail
            cd /opt/era-ecosystem
            git fetch origin
            git reset --hard "$GIT_SHA"
            if [ ! -f era.droplet.env ]; then
              echo "era.droplet.env missing after scp" >&2
              exit 1
            fi
            mv -f era.droplet.env .env
            bash docker/scripts/deploy-droplet.sh
