name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR tag (e.g. prod-abc1234 or latest)
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pack remote .env (base64)
        id: envpack
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          {
            printf '%s\n' "$ENV_FILE" | grep -vE '^(DRONE_SSH_|IMAGE_TAG=|GHCR_IMAGE_PREFIX=)' || true
            echo "IMAGE_TAG=${{ inputs.image_tag }}"
            echo "GHCR_IMAGE_PREFIX=ghcr.io/${owner}/era-ecosystem"
          } | base64 -w0 > /tmp/era-env.b64
          b64=$(cat /tmp/era-env.b64)
          echo "::add-mask::$b64"
          echo "b64=$b64" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          ERA_ENV_B64: ${{ steps.envpack.outputs.b64 }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || github.token }}
          GIT_SHA: ${{ github.sha }}
          GH_ACTOR: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 30m
          script_stop: false
          envs: ERA_ENV_B64,GHCR_PULL_TOKEN,GIT_SHA,GH_ACTOR
          script: |
            set -euo pipefail
            cd /opt/era-ecosystem
            git fetch origin
            # Droplet may have local traefik edits; deploy is pull-only and must not abort.
            git reset --hard "$GIT_SHA"
            # Pipes must live in deploy-droplet.sh — drone-ssh drops `|` lines.
            bash docker/scripts/deploy-droplet.sh
