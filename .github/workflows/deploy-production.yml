name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR tag (e.g. prod-abc1234 or latest)
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 20m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/era-ecosystem
            git fetch origin
            git checkout "${{ github.sha }}"
            cat > .env <<'ENVEOF'
            ${{ secrets.ENV_FILE }}
            ENVEOF
            echo "IMAGE_TAG=${{ inputs.image_tag }}" >> .env
            owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            echo "GHCR_IMAGE_PREFIX=ghcr.io/${owner}/era-ecosystem" >> .env
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            chmod +x docker/scripts/migrate-all.sh
            COMPOSE_FILE=docker-compose.prod.yml ./docker/scripts/migrate-all.sh
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            node scripts/ecosystem-smoke-all.mjs
