name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR tag (e.g. dev-abc1234 or dev)
        required: false
        default: dev
      scope:
        description: What to pull and restart (finance = orch + finance-core + finance-web)
        type: choice
        required: false
        default: finance
        options:
          - finance
          - finance-core
          - orchestrator
          - data-hub
          - hotel
          - clinic
          - fnb
          - retail
          - logistics
          - construction
          - crm
          - auto
          - wholesale
          - bank
          - all
  workflow_run:
    workflows: ["Build and push images"]
    branches: [dev, master]
    types: [completed]

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    steps:
      - name: Resolve git SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.value }}

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            short=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
            branch="${{ github.event.workflow_run.head_branch }}"
            echo "value=${branch}-${short}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve deploy scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.scope }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=all" >> "$GITHUB_OUTPUT"
          fi

      # Write .env on the runner and scp it — do not pass the file through SSH envs
      # (huge ERA_ENV_B64 was logged and can truncate sibling vars like the GHCR token).
      - name: Write droplet env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          {
            printf '%s\n' "$ENV_FILE" | grep -vE '^(DRONE_SSH_|IMAGE_TAG=|GHCR_IMAGE_PREFIX=|ERA_JWT_JWKS_URL=)' || true
            echo "IMAGE_TAG=${{ steps.tag.outputs.value }}"
            echo "GHCR_IMAGE_PREFIX=ghcr.io/${owner}/era-ecosystem"
            echo "ERA_JWT_JWKS_URL=http://orchestrator:4000/.well-known/jwks.json"
          } > "${GITHUB_WORKSPACE}/era.droplet.env"

      - name: Copy env to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || 22 }}
          source: era.droplet.env
          target: /opt/era-ecosystem
          overwrite: true
          timeout: 60s

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Always the job token — a stale GHCR_PULL_TOKEN PAT would win over github.token
          # and fail with `ghcr.io/v2/: denied`.
          GHCR_PULL_TOKEN: ${{ github.token }}
          GIT_SHA: ${{ steps.sha.outputs.value }}
          GH_ACTOR: ${{ github.actor }}
          DEPLOY_SCOPE: ${{ steps.scope.outputs.value }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 30m
          script_stop: false
          envs: GHCR_PULL_TOKEN,GIT_SHA,GH_ACTOR,DEPLOY_SCOPE
          script: |
            set -euo pipefail
            cd /opt/era-ecosystem
            git fetch origin
            git reset --hard "$GIT_SHA"
            if [ ! -f era.droplet.env ]; then
              echo "era.droplet.env missing after scp" >&2
              exit 1
            fi
            mv -f era.droplet.env .env
            bash docker/scripts/deploy-droplet.sh
