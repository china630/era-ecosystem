name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR tag (e.g. dev-abc1234 or dev)
        required: false
        default: dev
  # After GHCR build on `dev` — pull + migrate + up on the staging droplet.
  # Requires Environment `staging` secrets (SSH_*, ENV_FILE, GHCR_PULL_TOKEN)
  # and droplet UFW allowing SSH :22 from GitHub Actions.
  workflow_run:
    workflows: ["Build and push images"]
    branches: [dev]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    steps:
      - name: Resolve git SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.value }}

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            short=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
            echo "value=dev-${short}" >> "$GITHUB_OUTPUT"
          fi

      # Never expand multi-line ENV_FILE into the SSH script body: appleboy
      # script_stop injects exit checks between lines and corrupts .env.
      - name: Pack remote .env (base64)
        id: envpack
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          {
            printf '%s\n' "$ENV_FILE"
            echo "IMAGE_TAG=${{ steps.tag.outputs.value }}"
            echo "GHCR_IMAGE_PREFIX=ghcr.io/${owner}/era-ecosystem"
          } | base64 -w0 > /tmp/era-env.b64
          echo "b64=$(cat /tmp/era-env.b64)" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          ERA_ENV_B64: ${{ steps.envpack.outputs.b64 }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GIT_SHA: ${{ steps.sha.outputs.value }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          envs: ERA_ENV_B64,GHCR_PULL_TOKEN,GIT_SHA,GH_ACTOR
          script: |
            set -euo pipefail
            cd /opt/era-ecosystem
            git fetch origin
            git checkout "$GIT_SHA"
            printf '%s' "$ERA_ENV_B64" | base64 -d > .env
            # Drop duplicate keys if ENV_FILE already had IMAGE_TAG / GHCR prefix
            awk -F= '
              /^IMAGE_TAG=/ { k=$0; next }
              /^GHCR_IMAGE_PREFIX=/ { g=$0; next }
              { print }
              END { if (k!="") print k; if (g!="") print g }
            ' .env > .env.tmp && mv .env.tmp .env
            echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            chmod +x docker/scripts/migrate-all.sh
            COMPOSE_FILE=docker-compose.prod.yml ./docker/scripts/migrate-all.sh
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            node scripts/ecosystem-smoke-all.mjs || echo "WARN: ecosystem-smoke-all failed (non-blocking)"
