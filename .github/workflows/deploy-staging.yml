name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR tag (e.g. dev-abc1234 or dev)
        required: false
        default: dev
      scope:
        description: What to pull and restart (finance = orch + finance-core + finance-web)
        type: choice
        required: false
        default: finance
        options:
          - finance
          - finance-core
          - finance-web
          - orchestrator
          - data-hub
          - hotel
          - clinic
          - fnb
          - retail
          - logistics
          - construction
          - crm
          - auto
          - wholesale
          - bank
          - all
  workflow_run:
    workflows: ["Build and push images"]
    branches: [dev, master]
    types: [completed]

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    steps:
      - name: Resolve git SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.value }}

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            short=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
            branch="${{ github.event.workflow_run.head_branch }}"
            echo "value=${branch}-${short}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve deploy scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "value=${{ inputs.scope }}" >> "$GITHUB_OUTPUT"
            echo "services=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p /tmp/deploy-scope
          gh run download "$RUN_ID" -n deploy-scope -D /tmp/deploy-scope
          # Parse KEY=value lines. Do not `source` the file: DEPLOY_SERVICES is
          # space-separated (e.g. hotel-pms clinic) and unquoted assignment
          # would execute the second token (exit 127: clinic: command not found).
          SKIP=false
          DEPLOY_SCOPE=all
          DEPLOY_SERVICES=
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              SKIP=*) SKIP="${line#SKIP=}" ;;
              DEPLOY_SCOPE=*) DEPLOY_SCOPE="${line#DEPLOY_SCOPE=}" ;;
              DEPLOY_SERVICES=*) DEPLOY_SERVICES="${line#DEPLOY_SERVICES=}" ;;
            esac
          done < /tmp/deploy-scope/deploy-scope.env
          echo "skip=${SKIP:-false}" >> "$GITHUB_OUTPUT"
          echo "value=${DEPLOY_SCOPE:-all}" >> "$GITHUB_OUTPUT"
          echo "services=${DEPLOY_SERVICES:-}" >> "$GITHUB_OUTPUT"

      # Write .env on the runner and scp it — do not pass the file through SSH envs
      # (huge ERA_ENV_B64 was logged and can truncate sibling vars like the GHCR token).
      - name: Write droplet env file
        if: steps.scope.outputs.skip != 'true'
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          {
            printf '%s\n' "$ENV_FILE" | grep -vE '^(DRONE_SSH_|IMAGE_TAG=|GHCR_IMAGE_PREFIX=|ERA_JWT_JWKS_URL=|ELEKTRAWEB_BRIDGE_ENABLED=)' || true
            echo "IMAGE_TAG=${{ steps.tag.outputs.value }}"
            echo "GHCR_IMAGE_PREFIX=ghcr.io/${owner}/era-ecosystem"
            echo "ERA_JWT_JWKS_URL=http://orchestrator:4000/.well-known/jwks.json"
            echo "ELEKTRAWEB_BRIDGE_ENABLED=1"
          } > "${GITHUB_WORKSPACE}/era.droplet.env"

      - name: Copy env to droplet
        if: steps.scope.outputs.skip != 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || 22 }}
          source: era.droplet.env
          target: /opt/era-ecosystem
          overwrite: true
          timeout: 60s

      - name: Deploy over SSH
        if: steps.scope.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Always the job token — a stale GHCR_PULL_TOKEN PAT would win over github.token
          # and fail with `ghcr.io/v2/: denied`.
          GHCR_PULL_TOKEN: ${{ github.token }}
          GIT_SHA: ${{ steps.sha.outputs.value }}
          GH_ACTOR: ${{ github.actor }}
          DEPLOY_SCOPE: ${{ steps.scope.outputs.value }}
          DEPLOY_SERVICES: ${{ steps.scope.outputs.services }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 30m
          script_stop: false
          envs: GHCR_PULL_TOKEN,GIT_SHA,GH_ACTOR,DEPLOY_SCOPE,DEPLOY_SERVICES
          script: |
            set -euo pipefail
            cd /opt/era-ecosystem
            git fetch origin
            git reset --hard "$GIT_SHA"
            if [ ! -f era.droplet.env ]; then
              echo "era.droplet.env missing after scp" >&2
              exit 1
            fi
            mv -f era.droplet.env .env
            bash docker/scripts/deploy-droplet.sh
