# ERA Security Hygiene Program §3 — SAST (secrets + Semgrep + OSV)
# Tune-in: warn-friendly first; make required on branch protection after noise review.
name: Security SAST

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

concurrency:
  group: security-sast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep OWASP / JS-TS (tune-in: non-blocking)
        run: |
          set +e
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/typescript \
            --config=p/javascript \
            --exclude='**/.next/**' \
            --exclude='**/node_modules/**' \
            --exclude='**/generated/**' \
            --exclude='**/.wt-*/**' \
            --exclude='**/docker-data/**' \
            --exclude='**/Dockerfile*' \
            --exclude='**/*.nginx.conf' \
            --exclude='**/nginx*.conf'
          code=$?
          echo "semgrep_exit=$code"
          exit 0

  osv:
    name: deps (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: OSV-Scanner (tune-in: non-blocking)
        run: |
          set +e
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:v2.0.3 \
            --recursive \
            ./
          code=$?
          echo "osv_exit=$code"
          # Tune-in: report findings but do not fail the check
          exit 0
