# ERA Security Hygiene Program section 3 — SAST (secrets + Semgrep + OSV).
# Tune-in: scanners report findings but the job stays green until branch protection is enabled.
name: Security SAST

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

permissions:
  contents: read

concurrency:
  group: security-sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Gitleaks (tune-in: non-blocking)"
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source . --verbose --redact --no-banner
          code=$?
          echo "gitleaks_exit=$code"
          exit 0

  semgrep:
    name: sast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: "Semgrep OWASP / JS-TS (tune-in: non-blocking)"
        run: |
          set +e
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.110.0 \
            semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/typescript \
            --config=p/javascript \
            --exclude='**/.next/**' \
            --exclude='**/node_modules/**' \
            --exclude='**/generated/**' \
            --exclude='**/.wt-*/**' \
            --exclude='**/docker-data/**' \
            --exclude='**/Dockerfile*' \
            --exclude='**/*.nginx.conf' \
            --exclude='**/nginx*.conf'
          code=$?
          echo "semgrep_exit=$code"
          exit 0

  osv:
    name: deps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: "OSV-Scanner (tune-in: non-blocking)"
        run: |
          set +e
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:v2.0.3 \
            --recursive \
            ./
          code=$?
          echo "osv_exit=$code"
          exit 0
