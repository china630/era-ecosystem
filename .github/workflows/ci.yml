name: CI

on:
  pull_request:
    # `labeled` re-runs CI when era-ship adds ci-full to an already open PR.
    types: [opened, synchronize, reopened, labeled]
    branches: [dev, master]
  # Second run after merge. Needed when someone else landed on dev while the PR
  # was open, so the merge mix was never tested. While one person owns this
  # repo, a satellite push uses the same path stubs as the PR and does not
  # replay finance and every satellite. Remove the stubs only when that
  # assumption stops being true.
  push:
    branches: [dev, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build shared packages
        run: chmod +x scripts/ci-build-packages.sh && ./scripts/ci-build-packages.sh
      - name: Integration audit suite (strict)
        run: node scripts/run-integration-audits.mjs --strict
      - name: Integration audit unit tests
        run: node --test scripts/__tests__/integration-audit.spec.mjs
      - name: Design token lint (baseline)
        run: node scripts/lint-design-tokens.mjs
      - name: Design token layers lint (3-tier L1/L2/L3)
        run: node scripts/lint-token-layers.mjs
      - name: Design token lint unit tests
        run: node --test scripts/__tests__/design-tokens.spec.mjs scripts/__tests__/token-layers.spec.mjs
      - name: Asia/Baku clock lint (strict)
        run: npm run lint:baku-clock:strict
      - name: Asia/Baku clock unit tests
        run: npm run test:baku-clock
      - name: GHCR path-filter unit tests
        run: node --test scripts/__tests__/ci-changed-ghcr-services.spec.mjs
      - name: CI job scope unit tests
        run: node --test scripts/__tests__/ci-required-job-scope.spec.mjs
      - name: Acceptance consistency
        run: npm run check:acceptance
      - name: Acceptance consistency unit tests
        run: npm run test:acceptance

  orchestrator:
    runs-on: ubuntu-latest
    needs: packages
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build shared packages
        run: chmod +x scripts/ci-build-packages.sh && ./scripts/ci-build-packages.sh
      - name: Install and test orchestrator
        working-directory: era-orchestrator
        run: |
          npm ci
          npm run db:generate
          npm run test:api
          npm run build

  data-hub:
    runs-on: ubuntu-latest
    needs: packages
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide CI scope
        id: scope
        env:
          CI_FULL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-full') }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/ci-required-job-scope.mjs --query data-hub >> "$GITHUB_OUTPUT"
      - name: Stub
        if: steps.scope.outputs.run != 'true'
        run: echo "stub success data-hub"
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: "22"
      - name: "Prepare erafinance database (file dependency)"
        if: steps.scope.outputs.run == 'true'
        run: chmod +x scripts/ci-prepare-finance-database.sh && ./scripts/ci-prepare-finance-database.sh
      - name: Build shared packages
        if: steps.scope.outputs.run == 'true'
        run: chmod +x scripts/ci-build-packages.sh && ./scripts/ci-build-packages.sh
      - name: Test and build data-hub
        if: steps.scope.outputs.run == 'true'
        working-directory: era-data-hub
        run: npm ci && npm run test -w @era/data-hub-api && npm run build

  finance:
    runs-on: ubuntu-latest
    needs: packages
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://erafinance:erafinance@127.0.0.1:5432/erafinance?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      ERA_JWT_SECRET: ci-jwt-secret
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret
      PII_ENCRYPTION_KEY: ci-pii-encryption-key-32chars!!
      PII_BLIND_INDEX_KEY: ci-pii-blind-index-key-32chars!
      AUDIT_HASH_SECRET: ci-audit-hash-secret-min-32-chars
      NODE_ENV: test
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: erafinance
          POSTGRES_PASSWORD: erafinance
          POSTGRES_DB: erafinance
        options: >-
          --health-cmd "pg_isready -U erafinance -d erafinance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide CI scope
        id: scope
        env:
          CI_FULL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-full') }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/ci-required-job-scope.mjs --query finance >> "$GITHUB_OUTPUT"
      - name: Stub
        if: steps.scope.outputs.run != 'true'
        run: echo "stub success finance"
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: era-finance-core/package-lock.json
      - name: Build shared packages (file dependencies)
        if: steps.scope.outputs.run == 'true'
        run: chmod +x scripts/ci-build-packages.sh && ./scripts/ci-build-packages.sh
      - name: Install
        if: steps.scope.outputs.run == 'true'
        working-directory: era-finance-core
        run: npm ci
      - name: Prisma migrate deploy
        if: steps.scope.outputs.run == 'true'
        working-directory: era-finance-core
        run: npm run db:migrate:deploy
      - name: Validate posting role presets
        if: steps.scope.outputs.run == 'true'
        working-directory: era-finance-core/packages/database
        run: npx tsx prisma/scripts/validate-posting-roles.ts
      - name: NAS literal guard (finance API)
        if: steps.scope.outputs.run == 'true'
        run: node scripts/lint-nas-literals.mjs
      - name: Validate no NAS literals in API
        if: steps.scope.outputs.run == 'true'
        working-directory: era-finance-core
        run: npm run validate:no-nas-literals
      - name: ESLint API
        if: steps.scope.outputs.run == 'true'
        working-directory: era-finance-core
        run: npm run lint -w @erafinance/api
      - name: Prepare API test dependencies
        if: steps.scope.outputs.run == 'true'
        run: chmod +x scripts/ci-prepare-finance-api-tests.sh && ./scripts/ci-prepare-finance-api-tests.sh
      - name: Unit tests
        if: steps.scope.outputs.run == 'true'
        working-directory: era-finance-core
        env:
          TZ: UTC
        run: npm run test -w @erafinance/api -- --testPathPattern=src/ --testPathIgnorePatterns=e2e-spec --ci --forceExit --maxWorkers=2 --testTimeout=120000
      - name: Integration tests
        if: steps.scope.outputs.run == 'true'
        working-directory: era-finance-core
        run: npm run test:integration -w @erafinance/api -- --ci
      - name: Build monorepo
        if: steps.scope.outputs.run == 'true'
        working-directory: era-finance-core
        env:
          NODE_ENV: production
        run: npm run build

  bank-core:
    runs-on: ubuntu-latest
    needs: packages
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide CI scope
        id: scope
        env:
          CI_FULL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-full') }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/ci-required-job-scope.mjs --query bank-core >> "$GITHUB_OUTPUT"
      - name: Stub
        if: steps.scope.outputs.run != 'true'
        run: echo "stub success bank-core"
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: "22"
      - name: Build shared packages
        if: steps.scope.outputs.run == 'true'
        run: chmod +x scripts/ci-build-packages.sh && ./scripts/ci-build-packages.sh
      - name: Install, test, build bank-core
        if: steps.scope.outputs.run == 'true'
        working-directory: era-bank-core
        run: |
          npm ci
          npm test -- --ci
          npm run build

  satellite:
    runs-on: ubuntu-latest
    needs: packages
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dir:
          - era-hotel-pms
          - era-fnb-pos
          - era-clinic
          - era-retail-pos
          - era-logistics
          - era-construction
          - era-crm
          - era-auto-service
          - era-wholesale
          - era-bank
          - era-bank-dbo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide CI scope
        id: scope
        env:
          CI_FULL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-full') }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/ci-required-job-scope.mjs --query ${{ matrix.dir }} >> "$GITHUB_OUTPUT"
      - name: Stub
        if: steps.scope.outputs.run != 'true'
        run: echo "stub success ${{ matrix.dir }}"
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: "22"
      - name: Build shared packages
        if: steps.scope.outputs.run == 'true'
        run: chmod +x scripts/ci-build-packages.sh && ./scripts/ci-build-packages.sh
      - name: Build and test ${{ matrix.dir }}
        if: steps.scope.outputs.run == 'true'
        working-directory: ${{ matrix.dir }}
        env:
          CI: "true"
        run: |
          npm ci
          npx prisma generate
          npm test
          npm run build
          if [ -f .eslintrc.json ] || [ -f eslint.config.mjs ] || [ -f eslint.config.js ]; then
            npm run lint
          fi
