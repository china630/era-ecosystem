<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ERA 365 — архитектура платформы</title>
  <style>
    :root {
      --ink: #34495E;
      --blue: #2980B9;
      --blue-dark: #2471A3;
      --muted: #7F8C8D;
      --line: #D5DADF;
      --wash: #EBEDF0;
      --tint: #EBF5FB;
      --white: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      background: var(--white);
      color: var(--ink);
    }
    .page {
      max-width: 1152px;
      margin: 0 auto;
      padding: 32px 24px 40px;
    }
    .hero-copy { max-width: 680px; }
    .eyebrow {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      line-height: 1.15;
      letter-spacing: -0.02em;
      font-weight: 700;
      color: var(--ink);
    }
    .sub {
      margin: 0;
      font-size: 16px;
      line-height: 1.5;
      color: var(--muted);
      max-width: 600px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 20px 0 0;
    }
    .chip {
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--ink);
      border-radius: 8px;
      padding: 6px 12px;
      font: 600 12px/1.2 Inter, ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
    }
    .chip:hover, .chip:focus-visible {
      border-color: var(--blue);
      outline: none;
    }
    .chip.is-on {
      background: var(--tint);
      border-color: var(--blue);
      color: var(--blue-dark);
    }
    .stage {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(180deg, #f8fafb 0%, #ffffff 55%);
      overflow: hidden;
      position: relative;
    }
    svg { display: block; width: 100%; height: auto; }
    .platform { fill: #EBF5FB; fill-opacity: 0.55; stroke: #D5DADF; stroke-width: 1; }
    .platform-label {
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      fill: #7F8C8D;
    }
    .ring-crm { fill: none; stroke: #2980B9; stroke-opacity: 0.28; stroke-width: 1.15; }
    .ring-hr { fill: none; stroke: #7F8C8D; stroke-opacity: 0.32; stroke-width: 1.15; }
    .cluster-wash { fill: #2980B9; fill-opacity: 0.04; stroke: none; }
    .cluster-wash.bank { fill: #2980B9; fill-opacity: 0.06; }
    .cluster-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      fill: #7F8C8D;
    }
    .edge { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .edge.live.revenue { stroke: #a9c7db; stroke-width: 1.3; }
    .edge.live.folio { stroke: #2980B9; stroke-width: 1.35; stroke-opacity: 0.55; }
    .edge.live.life { stroke: #2980B9; stroke-width: 1.35; stroke-opacity: 0.7; }
    .edge.live.gl { stroke: #a9c7db; stroke-width: 1.6; }
    .edge.live.crm { stroke: #a9c7db; stroke-width: 1.3; }
    .edge.live.hr { stroke: #7F8C8D; stroke-width: 1.2; stroke-opacity: 0.5; }
    .edge.partial { stroke: #2980B9; stroke-width: 1.25; stroke-opacity: 0.5; stroke-dasharray: 8 4; }
    .edge.partial.ref { stroke: #7F8C8D; }
    .edge.planned { stroke: #7F8C8D; stroke-width: 1.15; stroke-opacity: 0.38; stroke-dasharray: 2 5; }
    .edge-caption { font-size: 8.5px; font-weight: 600; fill: #7F8C8D; }
    .pulse {
      fill: none;
      stroke: #2980B9;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 10 260;
      animation: travel 5s linear infinite;
      opacity: 0.85;
      pointer-events: none;
    }
    .pulse.p2 { animation-delay: -2.5s; stroke: #34495E; opacity: 0.4; }
    @keyframes travel { to { stroke-dashoffset: -270; } }
    .node { cursor: pointer; }
    .node:focus { outline: none; }
    .node:focus .sat, .node:focus .core-ring { stroke: #2471A3; }
    .sat { fill: #fff; stroke: #D5DADF; stroke-width: 1.25; }
    .icon-bg { fill: #EBF5FB; }
    .name { font-size: 11.5px; font-weight: 650; fill: #34495E; }
    .meta { font-size: 9.5px; fill: #7F8C8D; }
    .core-ring {
      fill: #EBF5FB;
      stroke: #2980B9;
      stroke-width: 1.6;
      transform-origin: 0 0;
      transform-box: fill-box;
      animation: breathe 4.8s ease-in-out infinite;
    }
    .core-dot { fill: #2980B9; }
    .core-name { font-size: 13px; font-weight: 700; fill: #34495E; }
    .core-meta { font-size: 10px; fill: #7F8C8D; }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.045); }
    }
    .badge-pill { fill: #fff; stroke: #2980B9; stroke-width: 1.2; stroke-opacity: 0.45; }
    .badge-pill.hr { stroke: #7F8C8D; }
    .pilot-bg { fill: #EBF5FB; stroke: rgba(41,128,185,.35); }
    .pilot { font-size: 8px; font-weight: 700; fill: #2471A3; }
    .spoke { fill: none; stroke: #7F8C8D; stroke-width: 1.1; stroke-opacity: 0.32; stroke-dasharray: 2 5; stroke-linecap: round; }
    /* hover / filter */
    .stage.is-hover .edge, .stage.is-hover .spoke { opacity: 0.14; }
    .stage.is-hover .edge.is-on, .stage.is-hover .spoke.is-on { opacity: 1; }
    .stage.is-hover .node { opacity: 0.28; }
    .stage.is-hover .node.is-on { opacity: 1; }
    .stage.is-filter .node { opacity: 0.22; }
    .stage.is-filter .node.is-in { opacity: 1; }
    .stage.is-filter .edge, .stage.is-filter .spoke { opacity: 0.1; }
    .stage.is-filter .edge.is-in, .stage.is-filter .spoke.is-in { opacity: 1; }
    .stage.is-hover.is-filter .node.is-in { opacity: 0.22; }
    .stage.is-hover.is-filter .node.is-on { opacity: 1; }
    .card {
      position: absolute;
      right: 16px;
      bottom: 16px;
      width: 260px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px 12px;
      box-shadow: 0 8px 24px rgba(52, 73, 94, 0.08);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }
    .card.is-open { opacity: 1; }
    .card h2 {
      margin: 0 0 2px;
      font-size: 15px;
      letter-spacing: -0.02em;
    }
    .card .price { margin: 0 0 6px; font-size: 12px; color: var(--muted); }
    .card .tag { margin: 0 0 8px; font-size: 13px; line-height: 1.4; }
    .card ul { margin: 0; padding: 0; list-style: none; }
    .card li { font-size: 11px; color: var(--muted); line-height: 1.45; }
    .card .st { font-weight: 650; color: var(--ink); }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      margin-top: 14px;
      font-size: 11px;
      color: var(--muted);
    }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .sw { width: 26px; height: 0; border-top: 2px solid #a9c7db; display: inline-block; }
    .sw.partial { border-color: #2980B9; border-top-style: dashed; }
    .sw.planned { border-color: #7F8C8D; border-top-style: dotted; }
    .sw.folio { border-color: #2980B9; opacity: .7; }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .core-ring { animation: none; }
    }
  </style>
</head>

        <g class="node" data-key="industry_crm" tabindex="0" transform="translate(476,26)" role="button" aria-label="CRM, от 29 AZN в месяц">
          <rect class="badge-pill" x="0" y="0" width="200" height="46" rx="23" />
          <text class="name" text-anchor="middle" x="100" y="20">CRM</text>

        <g class="node" data-key="platform_workforce" tabindex="0" transform="translate(36,548)" role="button" aria-label="Workforce, от 2 AZN за человека">
          <rect class="badge-pill hr" x="0" y="0" width="168" height="46" rx="23" />
          <text class="name" text-anchor="middle" x="84" y="20">Workforce</text>
          <text class="meta" text-anchor="middle" x="84" y="34">кадры · от 2 AZN / чел.</text>
        </g>
      </svg>
      <aside class="card" id="card" aria-live="polite"></aside>
    </div>

      <span><i class="sw"></i> есть в коде</span>

      <span><i class="sw folio"></i> фолио / жизненный цикл отеля</span>
    </div>
  </div>
  <script>
    const BUNDLES = {
      all: null,
      hotels: ['finance_core','industry_hotel_pms','industry_fnb_pos','industry_retail','industry_crm','platform_workforce'],
      sanatoriums: ['finance_core','industry_hotel_pms','industry_clinic','industry_fnb_pos','industry_crm','platform_workforce'],
      restaurants: ['finance_core','industry_fnb_pos','industry_hotel_pms','platform_workforce'],
      auto: ['finance_core','industry_auto_service','industry_retail','industry_crm'],
      logistics: ['finance_core','industry_logistics','industry_wholesale','industry_retail','industry_crm'],
      wholesale: ['finance_core','industry_wholesale','industry_retail','industry_logistics','industry_crm'],
      retail: ['finance_core','industry_retail','industry_wholesale','industry_hotel_pms','industry_crm'],
      construction: ['finance_core','industry_construction','platform_workforce','industry_crm','platform_datahub'],
      clinic: ['finance_core','industry_clinic','industry_hotel_pms','industry_crm','platform_workforce'],
      banking: ['finance_core','industry_banking','banking_dbo','banking_apps','platform_workforce','industry_crm','platform_datahub']
    };
    const CARDS = {
      finance_core: {
        name: 'ERA Core', price: 'от 29 AZN / мес', tag: 'Финансовое ядро: учёт, проводки, склад и расчёты.',
        edges: [['Выручка и проводки отраслей','есть'],['GL-summary банка','есть'],['Справочники Data HUB','частично'],['Счёт из строительного акта','в разработке']]
      },
      industry_banking: {
        name: 'Bank CBS', price: 'от 99 AZN / мес · Pilot', tag: 'Банковское ядро: счета, платежи, кредиты.',
        edges: [['Суточный GL в ERA Core','есть'],['ДБО и клиентские приложения','частично'],['Провижининг Workforce','частично'],['Клиенты в CRM / MDM','в разработке']]
      },
      industry_hotel_pms: {
        name: 'Hotel PMS', price: 'от 29 AZN / мес', tag: 'Бронь, фолио и проживание.',
        edges: [['Счета и аудит в ERA Core','есть'],['Фолио из F&B, клиники, розницы','есть'],['Заезд гостя в клинику','есть'],['Гость в CRM','в разработке']]
      },
      industry_fnb_pos: {
        name: 'F&B POS', price: 'от 29 AZN / мес', tag: 'Касса ресторана и бара, списания стока.',
        edges: [['Продажа и смена в учёт','есть'],['Постование в фолио отеля','есть'],['Штат из Workforce','есть']]
      },
      industry_clinic: {
        name: 'Clinic', price: 'от 29 AZN / мес · Pilot', tag: 'Клиника и санаторное лечение.',
        edges: [['Визиты и услуги в учёт','есть'],['Фолио в отель','есть'],['Заезд из Hotel PMS','есть'],['Пациент в CRM','в разработке']]
      },
      industry_construction: {
        name: 'Construction', price: 'от 29 AZN / мес · Pilot', tag: 'Сметы, акты и проекты.',
        edges: [['Проводки акта в ERA Core','есть'],['Табель в Workforce','есть'],['Заказчик в CRM','в разработке'],['Счёт из акта, материалы HUB','частично / долг']]
      },
      industry_auto_service: {
        name: 'Auto Service', price: 'от 29 AZN / мес', tag: 'Наряды автосервиса.',
        edges: [['Закрытый наряд в учёт','есть'],['Запчасти ↔ розница / склад','в разработке'],['Клиент в CRM','в разработке']]
      },
      industry_wholesale: {
        name: 'Wholesale', price: 'от 29 AZN / мес', tag: 'Оптовые заказы и контрагенты.',
        edges: [['Заказ в ERA Core','есть'],['OPS_HANDOFF в розницу','частично'],['Логистика, клиент в CRM','в разработке']]
      },
      industry_logistics: {
        name: 'Logistics', price: 'от 29 AZN / мес', tag: 'Рейсы, доставка, POD.',
        edges: [['Завершённый рейс в учёт','есть'],['Связь с оптом и розницей','в разработке']]
      },
      industry_retail: {
        name: 'Retail POS', price: 'от 29 AZN / мес · Pilot', tag: 'Розничные продажи и склад ядра.',
        edges: [['Продажа в учёт','есть'],['Фолио в отель','есть'],['Приём заказа из опта','частично'],['Доставка, запчасти, клиент в CRM','в разработке']]
      },
      industry_crm: {
        name: 'CRM', price: 'от 29 AZN / мес', tag: 'Общий клиентский слой: лиды и партии.',
        edges: [['Конвертация лида в ERA Core','есть'],['Намерение записи в клинику','частично'],['Гости, пациенты, заказчики из сателлитов','в разработке']]
      },
      platform_workforce: {
        name: 'Workforce', price: 'от 2 AZN / чел.', tag: 'Кадровый слой: штат и табель.',
        edges: [['Табель и HR-события в учёт','есть'],['Провижининг: отель, F&B, розница, клиника, стройка','есть'],['Провижининг банка','частично'],['Остальные сателлиты','в разработке']]
      },
      platform_datahub: {
        name: 'Data HUB', price: 'от 29 AZN / мес · Pilot', tag: 'Справочники платформы и будущая аналитика.',
        edges: [['Справочники в ERA Core','частично'],['Материалы для стройки','частично'],['Аналитика по всем сателлитам','в разработке']]
      },
      banking_dbo: {
        name: 'ДБО', price: 'Модуль Bank CBS · Pilot', tag: 'Дистанционное банковское обслуживание.',
        edges: [['Каналы к headless CBS','частично'],['Подключение к оркестратору','есть (платформа)']]
      },
      banking_apps: {
        name: 'Клиентские приложения', price: 'Каналы Bank CBS · Pilot', tag: 'Клиентские каналы банковского кластера.',
        edges: [['Связь с Bank CBS','частично'],['Живые интеграции по аудиту банка','в разработке']]
      }
    };

    const stage = document.getElementById('stage');
    const cardEl = document.getElementById('card');
    const nodes = [...stage.querySelectorAll('.node')];
    const edges = [...stage.querySelectorAll('.edge, .spoke')];

    function renderCard(key) {
      const c = CARDS[key];
      if (!c) { cardEl.classList.remove('is-open'); cardEl.innerHTML = ''; return; }
      cardEl.innerHTML = `<h2>${c.name}</h2><p class="price">${c.price}</p><p class="tag">${c.tag}</p><ul>${c.edges.map(([t,s]) => `<li><span class="st">${s}.</span> ${t}</li>`).join('')}</ul>`;
      cardEl.classList.add('is-open');
    }

    function setHover(key) {
      nodes.forEach(n => n.classList.toggle('is-on', n.dataset.key === key || incident(n.dataset.key, key)));
      edges.forEach(e => {
        const ks = (e.dataset.nodes || '').split(/\s+/);
        e.classList.toggle('is-on', ks.includes(key) || (ks.length === 1 && ks[0] === key));
      });
      stage.classList.add('is-hover');
      renderCard(key);
    }
    function incident(a, b) {
      return edges.some(e => {
        const ks = (e.dataset.nodes || '').split(/\s+/);
        return ks.includes(a) && ks.includes(b);
      });
    }
    function clearHover() {
      stage.classList.remove('is-hover');
      nodes.forEach(n => n.classList.remove('is-on'));
      edges.forEach(e => e.classList.remove('is-on'));
      cardEl.classList.remove('is-open');
    }

    nodes.forEach(n => {
      n.addEventListener('mouseenter', () => setHover(n.dataset.key));
      n.addEventListener('focus', () => setHover(n.dataset.key));
      n.addEventListener('mouseleave', clearHover);
      n.addEventListener('blur', clearHover);
    });

    document.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(b => b.classList.toggle('is-on', b === btn));
        const keys = BUNDLES[btn.dataset.filter];
        if (!keys) {
          stage.classList.remove('is-filter');
          nodes.forEach(n => n.classList.remove('is-in'));
          edges.forEach(e => e.classList.remove('is-in'));
          return;
        }
        stage.classList.add('is-filter');
        nodes.forEach(n => n.classList.toggle('is-in', keys.includes(n.dataset.key)));
        edges.forEach(e => {
          const ks = (e.dataset.nodes || '').split(/\s+/).filter(Boolean);
          const ok = ks.length === 0 ? false : ks.every(k => keys.includes(k) || k === 'platform_datahub' && keys.includes('platform_datahub'));
          e.classList.toggle('is-in', ks.every(k => keys.includes(k)));
        });
      });
    });
  </script>
</body>
</html>
