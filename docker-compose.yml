      DATABASE_URL: postgresql://${POSTGRES_USER:-era}:${POSTGRES_PASSWORD:-era_dev_password}@postgres:5432/${AUTO_SERVICE_DB:-era_auto_service}?schema=public
      PORT: "3208"
      HOSTNAME: 0.0.0.0
      ORCHESTRATOR_EVENT_URL: http://orchestrator:4000
      SATELLITE_EVENT_SERVICE_TOKEN: ${SATELLITE_EVENT_SERVICE_TOKEN:-dev-satellite-event-token}
      ERA_SATELLITE_ORGANIZATION_ID: ${ERA_SATELLITE_ORGANIZATION_ID:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-min-32-chars-for-satellites}
      ERA_SSO_SHARED_SECRET: ${ERA_SSO_SHARED_SECRET:-change-me-sso-hmac-secret}
    ports:
      - "3208:3208"
    depends_on:
      postgres:
        condition: service_healthy
      orchestrator:
        condition: service_started
    networks:
      - era-network

  wholesale:
    build:
      context: .
      dockerfile: docker/Dockerfile.satellite
      args:
        SATELLITE_DIR: era-wholesale
        SATELLITE_PORT: "3209"
    container_name: era-wholesale
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-era}:${POSTGRES_PASSWORD:-era_dev_password}@postgres:5432/${WHOLESALE_DB:-era_wholesale}?schema=public
      PORT: "3209"
      HOSTNAME: 0.0.0.0
      ORCHESTRATOR_EVENT_URL: http://orchestrator:4000
      SATELLITE_EVENT_SERVICE_TOKEN: ${SATELLITE_EVENT_SERVICE_TOKEN:-dev-satellite-event-token}
      ERA_SATELLITE_ORGANIZATION_ID: ${ERA_SATELLITE_ORGANIZATION_ID:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-min-32-chars-for-satellites}
      ERA_SSO_SHARED_SECRET: ${ERA_SSO_SHARED_SECRET:-change-me-sso-hmac-secret}
    ports:
      - "3209:3209"
    depends_on:
      postgres:
        condition: service_healthy
      orchestrator:
        condition: service_started
    networks:
      - era-network

  clinic:
    build:
      context: .
      dockerfile: docker/Dockerfile.satellite
      args:
        SATELLITE_DIR: era-clinic
        SATELLITE_PORT: "3203"
    container_name: era-clinic
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-era}:${POSTGRES_PASSWORD:-era_dev_password}@postgres:5432/${CLINIC_DB:-era_clinic}?schema=public
      PORT: "3203"
      HOSTNAME: 0.0.0.0
      HOTEL_PMS_URL: http://hotel-pms:3201
      POS_BRIDGE_SECRET: ${POS_BRIDGE_SECRET:-dev-pos-bridge-secret}
      ORCHESTRATOR_EVENT_URL: http://orchestrator:4000
      SATELLITE_EVENT_SERVICE_TOKEN: ${SATELLITE_EVENT_SERVICE_TOKEN:-dev-satellite-event-token}
      ERA_SATELLITE_ORGANIZATION_ID: ${ERA_CLINIC_ORGANIZATION_ID:-${ERA_SATELLITE_ORGANIZATION_ID:-}}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-min-32-chars-for-satellites}
      ERA_SSO_SHARED_SECRET: ${ERA_SSO_SHARED_SECRET:-change-me-sso-hmac-secret}
      RUN_SEED: ${CLINIC_RUN_SEED:-true}
      PLATFORM_SUPER_ADMIN_EMAILS: ${PLATFORM_SUPER_ADMIN_EMAILS:-chingiz@era.com,shirinov.chingiz@gmail.com,inaram84@gmail.com}
      PLATFORM_SUPER_ADMIN_BOOTSTRAP_PASSWORD: ${PLATFORM_SUPER_ADMIN_BOOTSTRAP_PASSWORD:-}
    ports:
      - "3203:3203"
    depends_on:
      postgres:
        condition: service_healthy
      orchestrator:
        condition: service_started
    networks:
      - era-network

  bank-core:
    build:
      context: .
      dockerfile: era-bank-core/Dockerfile
    container_name: era-bank-core
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "4300"
      DATABASE_URL: postgresql://${POSTGRES_USER:-era}:${POSTGRES_PASSWORD:-era_dev_password}@postgres:5432/${BANK_CORE_DB:-era_bank_core}?schema=public
      REDIS_URL: redis://redis:6379/5
      ERA_BANK_ORGANIZATION_ID: ${ERA_BANK_ORGANIZATION_ID:-demo-bank-org-001}
      BANK_CORE_SERVICE_TOKEN: ${BANK_CORE_SERVICE_TOKEN:-dev-bank-core-service-token}
      SATELLITE_EVENT_SERVICE_TOKEN: ${SATELLITE_EVENT_SERVICE_TOKEN:-dev-satellite-event-token}
      CONTROL_PLANE_URL: http://orchestrator:4000
      ERA_DATA_HUB_URL: http://data-hub:4200/registry/v1
      ERA_DATA_HUB_ONPREM: ${ERA_DATA_HUB_ONPREM:-false}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-dev-era-pii-encryption-key-32chars!!}
      PII_BLIND_INDEX_KEY: ${PII_BLIND_INDEX_KEY:-dev-era-pii-blind-index-key-32chars!}
      # Shared with era-bank-dbo for customer JWT + channel session signing
      BANK_DBO_JWT_SECRET: ${BANK_DBO_JWT_SECRET:-${DBO_JWT_SECRET:-change-me-dbo-jwt-secret-min-32-chars}}
      DEV_OTP_CODE: ${DEV_OTP_CODE:-123456}
      RUN_SEED: ${BANK_CORE_RUN_SEED:-true}
    ports:
      - "${BANK_CORE_API_PUBLISH_PORT:-4300}:4300"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - era-network

  bank:
    build:
      context: .
      dockerfile: docker/Dockerfile.satellite
      args:
        SATELLITE_DIR: era-bank
        SATELLITE_PORT: "3210"
    container_name: era-bank
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-era}:${POSTGRES_PASSWORD:-era_dev_password}@postgres:5432/${BANK_SATELLITE_DB:-era_bank}?schema=public
      PORT: "3210"
      HOSTNAME: 0.0.0.0
      ERA_BANK_CORE_URL: http://bank-core:4300
      BANK_CORE_SERVICE_TOKEN: ${BANK_CORE_SERVICE_TOKEN:-dev-bank-core-service-token}
      ERA_BANK_ORGANIZATION_ID: ${ERA_BANK_ORGANIZATION_ID:-demo-bank-org-001}
      ERA_SATELLITE_ORGANIZATION_ID: ${ERA_BANK_ORGANIZATION_ID:-${ERA_SATELLITE_ORGANIZATION_ID:-demo-bank-org-001}}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-min-32-chars-for-satellites}
      ERA_SSO_SHARED_SECRET: ${ERA_SSO_SHARED_SECRET:-change-me-sso-hmac-secret}
      ORCHESTRATOR_EVENT_URL: http://orchestrator:4000
      CONTROL_PLANE_URL: http://orchestrator:4000
      CONTROL_PLANE_SERVICE_TOKEN: ${CONTROL_PLANE_SERVICE_TOKEN:-dev-control-plane-token}
      SATELLITE_EVENT_SERVICE_TOKEN: ${SATELLITE_EVENT_SERVICE_TOKEN:-dev-satellite-event-token}
      RUN_SEED: ${BANK_RUN_SEED:-true}
    ports:
      - "${BANK_SATELLITE_PUBLISH_PORT:-3210}:3210"
    depends_on:
      postgres:
        condition: service_healthy
      bank-core:
        condition: service_started
      orchestrator:
        condition: service_started
    networks:
      - era-network

  bank-dbo:
    build:
      context: .
      dockerfile: docker/Dockerfile.satellite
      args:
        SATELLITE_DIR: era-bank-dbo
        SATELLITE_PORT: "3211"
    container_name: era-bank-dbo
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-era}:${POSTGRES_PASSWORD:-era_dev_password}@postgres:5432/${BANK_DBO_DB:-era_bank_dbo}?schema=public
      PORT: "3211"
      HOSTNAME: 0.0.0.0
      ERA_BANK_CORE_URL: http://bank-core:4300
      BANK_CORE_SERVICE_TOKEN: ${BANK_CORE_SERVICE_TOKEN:-dev-bank-core-service-token}
      ERA_BANK_ORGANIZATION_ID: ${ERA_BANK_ORGANIZATION_ID:-demo-bank-org-001}
      BANK_DBO_JWT_SECRET: ${BANK_DBO_JWT_SECRET:-${DBO_JWT_SECRET:-change-me-dbo-jwt-secret-min-32-chars}}
      DEV_OTP_CODE: ${DEV_OTP_CODE:-123456}
      RUN_SEED: ${BANK_DBO_RUN_SEED:-true}
    ports:
      - "${BANK_DBO_PUBLISH_PORT:-3211}:3211"
    depends_on:
      postgres:
        condition: service_healthy
      bank-core:
        condition: service_started
    networks:
      - era-network

networks:
  era-network:
    name: era-network
    driver: bridge
