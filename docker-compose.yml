# ERA Ecosystem — single-server stack (Traefik file provider).
# Usage: cp .env.example .env && docker compose up -d --build
# Spec: docs/ECOSYSTEM_URLS.md

name: era-ecosystem

services:
  postgres:
    image: postgres:16-alpine
    container_name: era-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-era}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-era_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-era}
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    networks:
      - era-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-era} -d ${POSTGRES_DB:-era}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: era-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./docker-data/redis:/data
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    networks:
      - era-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  traefik:
    image: traefik:v2.10
    container_name: era-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./docker-data/letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - era-network
    depends_on:
      orchestrator:
        condition: service_started
      finance-web:
        condition: service_started
      hotel-pms:
        condition: service_started
      fnb-pos:
        condition: service_started
      retail-pos:
        condition: service_started

  orchestrator:
    build:
      context: .
      dockerfile: era-orchestrator/Dockerfile
      args:
        NEXT_PUBLIC_ORCH_API_URL: ${ERA_API_ORIGIN:-http://127.0.0.1:4000}
        NEXT_PUBLIC_FINANCE_WEB_URL: ${ERA_FINANCE_ORIGIN:-http://127.0.0.1:3100}
        # Industry launcher deep-links — baked into the web bundle at build time.
        NEXT_PUBLIC_SATELLITE_HOTEL_URL: ${ERA_HOTEL_PMS_ORIGIN:-http://127.0.0.1:3201}
        NEXT_PUBLIC_SATELLITE_FNB_POS_URL: ${ERA_FNB_POS_ORIGIN:-http://127.0.0.1:3202}
        NEXT_PUBLIC_SATELLITE_CLINIC_URL: ${ERA_CLINIC_ORIGIN:-http://127.0.0.1:3203}
        NEXT_PUBLIC_SATELLITE_RETAIL_URL: ${ERA_RETAIL_ORIGIN:-http://127.0.0.1:3204}
    container_name: era-orchestrator
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-era}:${POSTGRES_PASSWORD:-era_dev_password}@postgres:5432/${ORCHESTRATOR_DB:-era_orchestrator}?schema=public
      MDM_DATABASE_URL: postgresql://${POSTGRES_USER:-era}:${POSTGRES_PASSWORD:-era_dev_password}@postgres:5432/${MDM_DB:-era_mdm}?schema=public
      REDIS_URL: redis://redis:6379/0
      API_PORT: "4000"
      WEB_PORT: "3000"
      FINANCE_CORE_URL: http://finance-core:4100
      CONTROL_PLANE_SERVICE_TOKEN: ${CONTROL_PLANE_SERVICE_TOKEN:-dev-control-plane-token}
      ORCHESTRATOR_INTERNAL_SERVICE_TOKEN: ${ORCHESTRATOR_INTERNAL_SERVICE_TOKEN:-${CONTROL_PLANE_SERVICE_TOKEN:-dev-control-plane-token}}
      ERA_JWT_SECRET: ${ERA_JWT_SECRET:-change-me-shared-hs256-secret-min-32-chars}
      ERA_JWT_ISSUER: ${ERA_JWT_ISSUER:-era-orchestrator}
      ERA_JWT_AUDIENCE_FINANCE: ${ERA_JWT_AUDIENCE_FINANCE:-era-finance-core}
      ERA_JWT_SIGNING_MODE: ${ERA_JWT_SIGNING_MODE:-dual}
      ERA_JWT_RS256_JWK_FILE: /run/era/rs256.jwk.json
      ERA_SSO_SHARED_SECRET: ${ERA_SSO_SHARED_SECRET:-change-me-sso-hmac-secret}
      SATELLITE_EVENT_SERVICE_TOKEN: ${SATELLITE_EVENT_SERVICE_TOKEN:-dev-satellite-event-token}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-dev-era-pii-encryption-key-32chars!!}
      PII_BLIND_INDEX_KEY: ${PII_BLIND_INDEX_KEY:-dev-era-pii-blind-index-key-32chars!}
      SATELLITE_EVENT_REDIS_URL: redis://redis:6379/0
      ERA_APP_ORIGIN: ${ERA_APP_ORIGIN:-http://127.0.0.1:3000}
      ERA_API_ORIGIN: ${ERA_API_ORIGIN:-http://127.0.0.1:4000}
      ERA_FINANCE_ORIGIN: ${ERA_FINANCE_ORIGIN:-http://127.0.0.1:3100}
      NEXT_PUBLIC_ORCH_API_URL: ${ERA_API_ORIGIN:-http://127.0.0.1:4000}
      NEXT_PUBLIC_ORCH_WEB_URL: ${ERA_APP_ORIGIN:-http://127.0.0.1:3000}
      NEXT_PUBLIC_FINANCE_WEB_URL: ${ERA_FINANCE_ORIGIN:-http://127.0.0.1:3100}
      FINANCE_WEB_URL: ${ERA_FINANCE_ORIGIN:-http://127.0.0.1:3100}
      # Nightly/droplet migrate-all already applied schema; skip boot migrate.
      SKIP_PRISMA_MIGRATE: ${SKIP_PRISMA_MIGRATE:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${ORCHESTRATOR_WEB_PUBLISH_PORT:-3000}:3000"
      - "${ORCHESTRATOR_API_PUBLISH_PORT:-4000}:4000"
    volumes:
      - ./era-orchestrator/dev-rs256-jwk.json:/run/era/rs256.jwk.json:ro
    networks:
      - era-network

  data-hub:
    build:
      context: .
      dockerfile: era-data-hub/Dockerfile
    container_name: era-data-hub
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "4200"
      DATABASE_URL: postgresql://${POSTGRES_USER:-era}:${POSTGRES_PASSWORD:-era_dev_password}@postgres:5432/${DATA_HUB_DB:-era_data_hub}?schema=public
      FINANCE_RO_DATABASE_URL: postgresql://${POSTGRES_USER:-era}:${POSTGRES_PASSWORD:-era_dev_password}@postgres:5432/${FINANCE_DB:-era_finance}?schema=public
      ERA_DATA_HUB_DATA_SOURCE: ${ERA_DATA_HUB_DATA_SOURCE:-finance_ro}
      REDIS_URL: redis://redis:6379/4
      DATA_HUB_SERVICE_TOKEN: ${DATA_HUB_SERVICE_TOKEN:-dev-data-hub-service-token}
      DATA_HUB_DEV_API_KEYS: ${DATA_HUB_DEV_API_KEYS:-dev-data-hub-key}
      PLATFORM_REFERENCE_DATA_MODE: ${PLATFORM_REFERENCE_DATA_MODE:-mvp}
      DATA_HUB_FINANCE_CATALOG_ROOT: /catalog/finance
      CONTROL_PLANE_URL: http://orchestrator:4000
      CONTROL_PLANE_SERVICE_TOKEN: ${CONTROL_PLANE_SERVICE_TOKEN:-dev-control-plane-token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      finance-core:
        condition: service_healthy
    ports:
      - "${DATA_HUB_API_PUBLISH_PORT:-4200}:4200"
    networks:
      - era-network

  finance-core:
    build:
      context: .
      dockerfile: era-finance-core/Dockerfile
    container_name: era-finance-core
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-era}:${POSTGRES_PASSWORD:-era_dev_password}@postgres:5432/${FINANCE_DB:-era_finance}?schema=public
      ERA_DATA_HUB_URL: http://data-hub:4200
      ERA_DATA_HUB_ENABLED: ${ERA_DATA_HUB_ENABLED:-false}
      ERA_DATA_HUB_FINANCE_CBAR_INGEST_DISABLED: ${ERA_DATA_HUB_FINANCE_CBAR_INGEST_DISABLED:-false}
      DATA_HUB_SERVICE_TOKEN: ${DATA_HUB_SERVICE_TOKEN:-dev-data-hub-service-token}
      REDIS_URL: redis://redis:6379/1
      API_PORT: "4100"
      CONTROL_PLANE_URL: http://orchestrator:4000
      CONTROL_PLANE_SERVICE_TOKEN: ${CONTROL_PLANE_SERVICE_TOKEN:-dev-control-plane-token}
      ORCHESTRATOR_INTERNAL_SERVICE_TOKEN: ${ORCHESTRATOR_INTERNAL_SERVICE_TOKEN:-${CONTROL_PLANE_SERVICE_TOKEN:-dev-control-plane-token}}
      ERA_JWT_SECRET: ${ERA_JWT_SECRET:-change-me-shared-hs256-secret-min-32-chars}
      ERA_JWT_ISSUER: ${ERA_JWT_ISSUER:-era-orchestrator}
      ERA_JWT_AUDIENCE_FINANCE: ${ERA_JWT_AUDIENCE_FINANCE:-era-finance-core}
      ERA_JWT_VERIFY_MODE: ${ERA_JWT_VERIFY_MODE:-dual}
      ERA_JWT_JWKS_URL: ${ERA_JWT_JWKS_URL:-http://orchestrator:4000/.well-known/jwks.json}
      ERA_AUTH_MODE: ${ERA_AUTH_MODE:-legacy}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-dev-era-pii-encryption-key-32chars!!}
      PII_BLIND_INDEX_KEY: ${PII_BLIND_INDEX_KEY:-dev-era-pii-blind-index-key-32chars!}
      AUDIT_HASH_SECRET: ${AUDIT_HASH_SECRET:-dev-era-audit-hash-secret-min-32-chars}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      SATELLITE_EVENT_WORKER_DISABLED: ${SATELLITE_EVENT_WORKER_DISABLED:-0}
      SATELLITE_EVENT_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${FINANCE_API_PUBLISH_PORT:-4100}:4100"
    networks:
      - era-network

  finance-web:
    build:
      context: .
      dockerfile: era-finance-core/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://finance-core:4100
        NEXT_PUBLIC_CONTROL_PLANE_URL: http://orchestrator:4000
        NEXT_PUBLIC_ORCH_WEB_URL: ${ERA_APP_ORIGIN:-http://127.0.0.1:3000}
    container_name: era-finance-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3100"
      NEXT_PUBLIC_API_URL: http://finance-core:4100
      NEXT_PUBLIC_CONTROL_PLANE_URL: http://orchestrator:4000
      NEXT_PUBLIC_ORCH_WEB_URL: ${ERA_APP_ORIGIN:-http://127.0.0.1:3000}
      CONTROL_PLANE_URL: http://orchestrator:4000
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-az}
    depends_on:
      finance-core:
        condition: service_healthy
      orchestrator:
        condition: service_started
    ports:
      - "${FINANCE_WEB_PUBLISH_PORT:-3100}:3100"
    networks:
      - era-network

  hotel-pms:
    build:
      context: .
      dockerfile: docker/Dockerfile.satellite
      args:
        SATELLITE_DIR: era-hotel-pms
        SATELLITE_PORT: "3201"
    container_name: era-hotel-pms
    restart: unless-stopped
    environment:
