      context: .
      dockerfile: docker/Dockerfile.satellite
      args:
        SATELLITE_DIR: era-construction
        SATELLITE_PORT: "3206"
    container_name: era-construction
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-era}:${POSTGRES_PASSWORD:-era_dev_password}@postgres:5432/${CONSTRUCTION_DB:-era_construction}?schema=public
      PORT: "3206"
      HOSTNAME: 0.0.0.0
      ORCHESTRATOR_EVENT_URL: http://orchestrator:4000
      SATELLITE_EVENT_SERVICE_TOKEN: ${SATELLITE_EVENT_SERVICE_TOKEN:-dev-satellite-event-token}
      ERA_SATELLITE_ORGANIZATION_ID: ${ERA_SATELLITE_ORGANIZATION_ID:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-min-32-chars-for-satellites}
      ERA_SSO_SHARED_SECRET: ${ERA_SSO_SHARED_SECRET:-change-me-sso-hmac-secret}
    ports:
      - "3206:3206"
    depends_on:
      postgres:
        condition: service_healthy
      orchestrator:
        condition: service_started
    networks:
      - era-network

  crm:
    build:
      context: .
      dockerfile: docker/Dockerfile.satellite
      args:
        SATELLITE_DIR: era-crm
        SATELLITE_PORT: "3207"
    container_name: era-crm
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-era}:${POSTGRES_PASSWORD:-era_dev_password}@postgres:5432/${CRM_DB:-era_crm}?schema=public
      PORT: "3207"
      HOSTNAME: 0.0.0.0
      ORCHESTRATOR_EVENT_URL: http://orchestrator:4000
      SATELLITE_EVENT_SERVICE_TOKEN: ${SATELLITE_EVENT_SERVICE_TOKEN:-dev-satellite-event-token}
      ERA_SATELLITE_ORGANIZATION_ID: ${ERA_SATELLITE_ORGANIZATION_ID:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-min-32-chars-for-satellites}
      ERA_SSO_SHARED_SECRET: ${ERA_SSO_SHARED_SECRET:-change-me-sso-hmac-secret}
    ports:
      - "3207:3207"
    depends_on:
