# ERA git-ship path manifests — used by era-ship.ps1 and era-git-ship SKILL.md
# Match: path prefix or exact file; first matching wave bucket wins (full wave order).

full_wave_order:
  - orchestrator
  - data-hub
  - mdm
  - rest

scopes:
  orchestrator:
    label: Orchestrator (control plane)
    aliases: [orch, оркестратор]
    paths:
      - era-orchestrator/
    commit_prefix: "feat(orchestrator)"

  data-hub:
    label: Data Hub (reference registry)
    aliases: [datahub, data-hub, дата-хаб, датахаб]
    paths:
      - era-data-hub/
      - packages/era-contracts/src/reference-data/
      - docs/adr/era-data-hub.md
      - docs/adr/fx-rates-ecosystem.md
      - docs/adr/production-calendar-ecosystem.md
      - docs/adr/reference-data-ecosystem.md
      - docs/adr/reference-data-phase2-catalogs.md
      - docs/adr/hotel-auto-pricing-production-calendar.md
      - docs/REFERENCE_DATA_CONSUMER_AUDIT.md
      - scripts/audit-reference-data.mjs
      - scripts/smoke-data-hub.mjs
      - packages/satellite-kit/src/integration/calendar.client.ts
      - packages/satellite-kit/src/integration/fx-rate.client.ts
      - packages/satellite-kit/src/integration/reference-catalog.client.ts
      - packages/satellite-kit/src/ui/fx-equivalent-badge.tsx
    also_stage_if_touched:
      - packages/era-contracts/src/index.ts
      - packages/satellite-kit/src/index.ts
      - packages/satellite-kit/src/ui/index.ts
      - packages/satellite-kit/src/integration/finance-handoffs.client.ts
    commit_prefix: "feat(data-hub)"

  mdm:
    label: MDM (person identity)
    aliases: [mdm, мдм]
    paths:
      - era-orchestrator/packages/mdm-database/
      - packages/era-contracts/src/mdm/
      - docs/MDM_IDENTITY_AUDIT.md
      - docs/adr/era-mdm-natural-person-identity.md
      - docs/adr/mdm-legal-entity-vs-finance-counterparty-registry.md
      - docs/adr/mdm-phase2-person-access-consent.md
      - docs/adr/mdm-satellite-integration-contract.md
      - scripts/audit-mdm-identity.mjs
      - packages/satellite-kit/src/integration/mdm-lookup.client.ts
      - packages/satellite-kit/src/integration/person-identity.client.ts
      - packages/satellite-kit/src/ui/voen-lookup-field.tsx
    path_globs:
      - "*/app/api/mdm/**"
      - "*/src/**/mdm/**"
    also_stage_if_touched:
      - packages/era-contracts/src/index.ts
      - packages/satellite-kit/src/index.ts
      - packages/satellite-kit/src/ui/index.ts
      - era-finance-core/apps/api/src/orchestrator/orchestrator-mdm-client.service.ts
    commit_prefix: "feat(mdm)"

  finance:
    label: Finance satellite
    aliases: [finance, fin, финансы, finance-core]
    paths:
      - era-finance-core/
    commit_prefix: "feat(finance)"

  bank-core:
    label: Bank core engine
    aliases: [bank-core, bankcore, банк-core]
    paths:
      - era-bank-core/
    commit_prefix: "feat(bank-core)"

  bank:
    label: Bank ops UI + DBO
    aliases: [bank, bank-dbo, dbo, банк]
    paths:
      - era-bank/
      - era-bank-dbo/
    commit_prefix: "feat(bank)"

  packages:
    label: Shared packages (contracts, satellite-kit, clinic-domain)
    aliases: [packages, kit, contracts]
    paths:
      - packages/era-contracts/
      - packages/satellite-kit/
      - packages/clinic-domain/
      - packages/era-fiscal/
    commit_prefix: "feat(packages)"

  platform:
    label: Platform infra (CI, docker, root docs)
    aliases: [platform, infra, ci, docker]
    paths:
      - .github/workflows/
      - docker-compose.yml
      - docker/
      - .env.example
      - .cursorrules
      - docs/COVERAGE_MATRIX.md
      - docs/READINESS_MATRIX.md
      - docs/ECOSYSTEM_URLS.md
      - docs/INTEGRATION_SSO_EVENTS.md
      - docs/MODULES_CATALOG.md
      - docs/SATELLITE_DOCUMENTATION.md
      - docs/SETUP_AND_RUN.md
      - docs/SMOKE_ALL_SERVICES.md
      - docs/LOCAL_UAT_GAP_CHECKLIST.md
      - docs/DEVELOPMENT_ROADMAP.md
      - scripts/readiness-strict-delivery.mjs
      - scripts/lint-nas-literals.mjs
    commit_prefix: "chore(platform)"

  rest:
    label: Everything not matched above (satellites + cross-cutting)
    paths: []
    commit_prefix: "feat(ecosystem)"

satellites:
  hotel:
    dir: era-hotel-pms
    aliases: [hotel, hotel-pms, отель]
    commit_prefix: "feat(hotel)"
  clinic:
    dir: era-clinic
    aliases: [clinic, клиника]
    commit_prefix: "feat(clinic)"
  wholesale:
    dir: era-wholesale
    aliases: [wholesale, опт]
    commit_prefix: "feat(wholesale)"
  logistics:
    dir: era-logistics
    aliases: [logistics, логистика]
    commit_prefix: "feat(logistics)"
  construction:
    dir: era-construction
    aliases: [construction, стройка]
    commit_prefix: "feat(construction)"
  crm:
    dir: era-crm
    aliases: [crm]
    commit_prefix: "feat(crm)"
  auto-service:
    dir: era-auto-service
    aliases: [auto, auto-service, автосервис]
    commit_prefix: "feat(auto-service)"
  fnb-pos:
    dir: era-fnb-pos
    aliases: [fnb, fnb-pos, pos-fb]
    commit_prefix: "feat(fnb-pos)"
  retail-pos:
    dir: era-retail-pos
    aliases: [retail, retail-pos]
    commit_prefix: "feat(retail-pos)"

never_commit:
  - docker-data/
  - .env
  - .env.local
  - "**/.env"
  - .cursor/
  - node_modules/
  - "**/npm-cache/"
  - test-results/
  - tmp/
  - tools/__pycache__/
  - data/
  - data/legal-entities/.cache/
