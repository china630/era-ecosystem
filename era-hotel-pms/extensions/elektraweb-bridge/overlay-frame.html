<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      color-scheme: light;
      font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
      color: #1a2332;
      -webkit-text-fill-color: #1a2332;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
    .lamp {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 2px 10px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.12);
      cursor: pointer;
      display: block;
      padding: 0;
      background: #6b7280;
    }
    .panel {
      display: none;
      width: 300px;
      background: #fff;
      border: 1px solid #d7dee6;
      border-radius: 10px;
      box-shadow: 0 8px 28px rgba(0,0,0,.22);
      padding: 12px;
      box-sizing: border-box;
      color: #1a2332;
      -webkit-text-fill-color: #1a2332;
    }
    .panel.open { display: block; }
    .head h1 {
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 2px;
      color: #1a2332;
    }
    .tag, .hint {
      color: #5c6b7a;
      -webkit-text-fill-color: #5c6b7a;
      font-size: 12px;
      margin: 0;
    }
    .hint { margin: 0 0 8px; }
    .status { margin: 0 0 8px; }
    .row { margin: 5px 0; }
    .ok { color: #0a7a2f; -webkit-text-fill-color: #0a7a2f; }
    .err { color: #b00020; -webkit-text-fill-color: #b00020; }
    .switch {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      margin: 8px 0;
      cursor: pointer;
      color: #1a2332;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    button {
      padding: 6px 10px;
      border: 0;
      border-radius: 6px;
      background: #0b5fff;
      color: #fff;
      -webkit-text-fill-color: #fff;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }
    button.secondary { background: #4b5563; }
    .field {
      display: block;
      margin: 8px 0 0;
      font-size: 12px;
      font-weight: 600;
      color: #5c6b7a;
      -webkit-text-fill-color: #5c6b7a;
    }
    .field input {
      display: block;
      width: 100%;
      margin-top: 4px;
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid #d7dee6;
      border-radius: 6px;
      font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
      color: #1a2332;
      -webkit-text-fill-color: #1a2332;
      background: #fff;
    }
    #loginBox { margin: 0 0 8px; }
    #loginMsg { margin: 8px 0 0; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel" id="panel" role="dialog">
      <div class="head">
        <div>
          <h1 id="title">ERA Elektraweb Bridge</h1>
          <p class="tag" id="deskLabel"></p>
        </div>
      </div>
      <p class="hint" id="lampHint"></p>
      <div class="status" id="status"></div>
      <form id="loginBox" hidden>
        <p class="hint" id="loginHint"></p>
        <label class="field"><span id="loginLblText">ERA login</span>
          <input id="ovLogin" name="username" autocomplete="username" spellcheck="false" />
        </label>
        <label class="field"><span id="passwordLblText">ERA password</span>
          <input id="ovPassword" name="password" type="password" autocomplete="current-password" />
        </label>
        <div class="actions">
          <button type="submit" id="btnLogin">Log in</button>
          <button type="button" class="secondary" id="openOptionsLogin">Settings</button>
        </div>
        <div id="loginMsg"></div>
      </form>
      <div id="opsBox">
        <label class="switch"><input type="checkbox" id="enabled" /><span id="enabledLbl">Capture</span></label>
        <label class="switch" id="writeRow"><input type="checkbox" id="writeEnabled" /><span id="writeLbl">Write</span></label>
        <div class="actions">
          <button type="button" class="secondary" id="openOptions">Settings</button>
          <button type="button" id="flush">Flush</button>
        </div>
      </div>
      <div class="actions" id="setupActions" hidden>
        <button type="button" class="secondary" id="openOptionsSetup">Settings</button>
      </div>
    </div>
    <button type="button" class="lamp" id="lamp" aria-label="ERA Elektraweb Bridge"></button>
  </div>
  <script type="module" src="overlay-frame.js"></script>
</body>
</html>
