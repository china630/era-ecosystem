<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="extName">Bridge</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body class="ew-popup">
    <div class="ew-pop-head">
      <span id="lampDot" class="ew-lamp" data-color="gray" aria-hidden="true"></span>
      <div>
        <h1 data-i18n="extName">ERA ↔ Elektraweb</h1>
        <p class="ew-tag" id="deskLabel"></p>
      </div>
    </div>
    <p id="lampHint" class="ew-lamp-hint"></p>
    <div id="status">…</div>
    <label class="ew-switch">
      <input type="checkbox" id="enabled" />
      <span data-i18n="inboundToggle">Capture &amp; sync</span>
    </label>
    <label class="ew-switch" id="writeRow">
      <input type="checkbox" id="writeEnabled" />
      <span data-i18n="writeToggle">Drain extra-ticket outbox</span>
    </label>
    <div class="ew-pop-actions">
      <button id="openOptions" class="secondary" type="button" data-i18n="openSettings">Login / settings</button>
      <button id="flush" type="button" data-i18n="flushNow">Flush now</button>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
