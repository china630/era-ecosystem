# Traefik dynamic routing — era-network (see docs/ECOSYSTEM_URLS.md).
# Finance API public host: finance-api.era-365.online (same :4100; gate at edge if needed).

http:
  routers:
    apex-redirect:
      rule: Host(`era-365.online`)
      entryPoints:
        - web
      middlewares:
        - apex-to-app
      service: orchestrator-web
      priority: 100

    orchestrator-app:
      rule: Host(`app.era-365.online`)
      entryPoints:
        - web
      service: orchestrator-web

    orchestrator-api:
      rule: Host(`api.era-365.online`)
      entryPoints:
        - web
      service: orchestrator-api

    finance-web:
      rule: Host(`finance-core.era-365.online`)
      entryPoints:
        - web
      service: finance-web

    finance-api:
      rule: Host(`finance-api.era-365.online`)
      entryPoints:
        - web
      service: finance-api

    hotel-pms:
      rule: Host(`hotel-pms.era-365.online`)
      entryPoints:
        - web
      service: hotel-pms

    fnb-pos:
      rule: Host(`fnb-pos.era-365.online`)
      entryPoints:
        - web
      service: fnb-pos

    retail-pos:
      rule: Host(`retail-pos.era-365.online`)
      entryPoints:
        - web
      service: retail-pos

    logistics:
      rule: Host(`logistics.era-365.online`)
      entryPoints:
        - web
      service: logistics

    construction:
      rule: Host(`construction.era-365.online`)
      entryPoints:
        - web
      service: construction

    crm:
      rule: Host(`crm.era-365.online`)
      entryPoints:
        - web
      service: crm

    auto-service:
      rule: Host(`auto-service.era-365.online`)
      entryPoints:
        - web
      service: auto-service

    wholesale:
      rule: Host(`wholesale.era-365.online`)
      entryPoints:
        - web
      service: wholesale

    clinic:
      rule: Host(`clinic.era-365.online`)
      entryPoints:
        - web
      service: clinic

  middlewares:
    apex-to-app:
      redirectRegex:
        regex: "^https?://era-365\\.online/(.*)"
        replacement: "https://app.era-365.online/${1}"
        permanent: true

  services:
    orchestrator-web:
      loadBalancer:
        servers:
          - url: "http://orchestrator:3000"

    orchestrator-api:
      loadBalancer:
        servers:
          - url: "http://orchestrator:4000"

    finance-web:
      loadBalancer:
        servers:
          - url: "http://finance-web:3100"

    finance-api:
      loadBalancer:
        servers:
          - url: "http://finance-core:4100"

    hotel-pms:
      loadBalancer:
        servers:
          - url: "http://hotel-pms:3201"

    fnb-pos:
      loadBalancer:
        servers:
          - url: "http://fnb-pos:3202"

    retail-pos:
      loadBalancer:
        servers:
          - url: "http://retail-pos:3204"

    logistics:
      loadBalancer:
        servers:
          - url: "http://logistics:3205"

    construction:
      loadBalancer:
        servers:
          - url: "http://construction:3206"

    crm:
      loadBalancer:
        servers:
          - url: "http://crm:3207"

    auto-service:
      loadBalancer:
        servers:
          - url: "http://auto-service:3208"

    wholesale:
      loadBalancer:
        servers:
          - url: "http://wholesale:3209"

    clinic:
      loadBalancer:
        servers:
          - url: "http://clinic:3203"
