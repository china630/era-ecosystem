# Traefik static configuration — file provider only (no Docker labels for routing).
# IMPORTANT: do NOT redirect entryPoint `web` (:80) globally to HTTPS — that breaks
# Let's Encrypt HTTP-01 challenges. HTTP→HTTPS redirect lives in dynamic.yml and
# excludes `/.well-known/acme-challenge/`.
api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

certificatesResolvers:
  letsencrypt:
    acme:
      email: ops@era-365.online
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

log:
  level: INFO

accessLog: {}
